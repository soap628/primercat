events {
  worker_connections 1024;
}

http {
  # ── 首次获取证书前用这个（只保留 HTTP）──────────────────────
  # 获得证书后删掉这段，改用下面的 HTTPS server
  server {
    listen 80;
    server_name primercat.tech www.primercat.tech;

    # Certbot webroot 验证
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name primercat.tech www.primercat.tech;

    ssl_certificate     /etc/letsencrypt/live/primercat.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primercat.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传大文件限制（BLAST 序列可能较长）
    client_max_body_size 4m;

    # ── SSE 接口：关闭缓冲，保持长连接 ──
    location /api/v1/gene-primer/ {
      proxy_pass         http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header   Connection '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 300s;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 普通 API ──
    location /api/ {
      proxy_pass         http://backend:8000;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 前端 ──
    location / {
      proxy_pass         http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        'upgrade';
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
