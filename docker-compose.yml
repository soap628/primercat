name: primercat

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primercat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/primercat
      SECRET_KEY: ${SECRET_KEY}
      NCBI_CACHE_DIR: /var/cache/primercat/ncbi
      BACKEND_CORS_ORIGINS: https://primercat.tech,https://www.primercat.tech
      COOKIE_SECURE: "true"
      GRNA_BOWTIE2_INDEX_MOUSE: /var/lib/primercat/reference/GCF_000001635.27_GRCm39/bowtie2/GCF_000001635.27_GRCm39
      GRNA_GENOME_FASTA_MOUSE: /var/lib/primercat/reference/GCF_000001635.27_GRCm39/GCF_000001635.27_GRCm39_genomic.fna
      GRNA_ANNOTATION_GTF_MOUSE: /var/lib/primercat/reference/GCF_000001635.27_GRCm39/GCF_000001635.27_GRCm39_genomic.gtf
      QPCR_TRANSCRIPT_LOCUS_DB_MOUSE: /var/lib/primercat/reference/GCF_000001635.27_GRCm39/qpcr-transcript-loci.sqlite3
      QPCR_TRANSCRIPTOME_BOWTIE2_INDEX_MOUSE: /var/lib/primercat/reference/GCF_000001635.27_GRCm39/bowtie2-transcriptome/GCF_000001635.27_GRCm39_rna
      QPCR_TRANSCRIPTOME_FASTA_MOUSE: /var/lib/primercat/reference/GCF_000001635.27_GRCm39/GCF_000001635.27_GRCm39_rna.fna
      GENOME_REFERENCE_ASSEMBLY_MOUSE: GCF_000001635.27
    volumes:
      - ncbi-cache:/var/cache/primercat/ncbi
      - ${PRIMERCAT_REFERENCE_ROOT:-./reference-data}:/var/lib/primercat/reference:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://primercat.tech/api/v1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    entrypoint: /bin/sh
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # certbot 镜像默认入口是 certbot；改为 shell 后再运行续期循环。
    # 一次性签发命令仍可通过 `docker compose run --entrypoint certbot ...` 执行。
    command:
      - -c
      - trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;

volumes:
  pgdata:
  certbot-conf:
  certbot-www:
  ncbi-cache:
