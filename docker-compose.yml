name: primercat

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: primercat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/primercat
      SECRET_KEY: ${SECRET_KEY}
      NCBI_CACHE_DIR: /var/cache/primercat/ncbi
      BACKEND_CORS_ORIGINS: https://primercat.tech,https://www.primercat.tech
      COOKIE_SECURE: "true"
    volumes:
      - ncbi-cache:/var/cache/primercat/ncbi
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://primercat.tech/api/v1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 每 12 小时自动续期（循环放在 command 而非 entrypoint，
    # 这样 `docker compose run --rm certbot certonly ...` 能正常执行一次性命令）
    command: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  certbot-conf:
  certbot-www:
  ncbi-cache:
